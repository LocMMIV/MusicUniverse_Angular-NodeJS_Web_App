<div class="container-fluid">

    <!-- Thể loại -->
    <div class="genre">
        <div class="filters">
            <div class="filter-item">
                <div class="genre-filters">
                    <!-- Tất cả -->
                    <button (click)="setGenreId(null)"
                        [class.active]="selectedGenreId === null">
                        <i class="bi bi-music-note"></i>Tất cả
                    </button>

                    <button *ngFor="let g of genres"
                        (click)="setGenreId(g.id)"
                        [class.active]="selectedGenreId === g.id">
                        <i class="bi bi-music-note"></i>{{ g.name }}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bài hát -->
    <table class="song-table">
        <thead>
            <tr>
                <th></th>
                <th>BÀI HÁT</th>
                <th>THỂ LOẠI</th>
                <th>NGHỆ SĨ</th>
                <th></th>
                <th>THỜI GIAN</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let listSong of filteredList; let i = index"
            (click)="playSong(listSong)" [class.active]="currentSong?.id === listSong.id">
                <td><i class="bi bi-music-note-beamed"></i></td>
                <td>
                    <div class="song-info">
                        <div class="image-wrapper">
                            <img [src]="listSong.image || '/assets/images/default.png'" class="song-image">
                            <i class="bi play-icon" [ngClass]="{
                                'bi-pause-fill': currentSong?.id === listSong.id && isPlaying,
                                'bi-play-fill': currentSong?.id !== listSong.id || !isPlaying,
                                'active': currentSong?.id === listSong.id }" >
                            </i>
                        </div>

                        <span class="song-name">{{ listSong.songName }}</span>
                    </div>
                </td>
                <td>{{ listSong.genre }}</td>
                <td><p class="artist">{{ listSong.artist }}</p></td>
                <td>
                    <i class="bi" [ngClass]="listSong.isLiked ? 'bi-heart-fill' : 'bi-heart'" 
                    (click)="toggleLike(i); $event.stopPropagation()" ></i>
                </td>
                <td><p class="duration">{{ listSong.duration || '...' }}</p></td>
            </tr>
        </tbody>
    </table>

</div>
